<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkillCraft Stopwatch</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <div class="stopwatch">

        <p class="label">
            SKILLCRAFT TECHNOLOGY
        </p>

        <h1>
            STOPWATCH
        </h1>

        <div class="time" id="display">
            00:00:00.00
        </div>


        <div class="buttons">

            <button id="start">
                Start
            </button>

            <button id="pause">
                Pause
            </button>

            <button id="lap">
                Lap
            </button>

            <button id="reset">
                Reset
            </button>

        </div>


        <div class="laps-wrap">

            <h2>
                Lap Times
            </h2>

            <ol id="laps"></ol>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
